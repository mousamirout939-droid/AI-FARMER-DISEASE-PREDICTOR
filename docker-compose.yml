version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: ai-farmer-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_farmer

  ai-service:
    build:
      context: ./ai-service
    container_name: ai-farmer-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/checkpoints:/app/checkpoints
      - ./ai-service/dataset:/app/dataset
    environment:
      ENVIRONMENT: production
      DEVICE: cpu
      CORS_ORIGINS: http://localhost:5173,http://localhost:5000,http://frontend

  backend:
    build:
      context: ./backend
    container_name: ai-farmer-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/ai_farmer
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production_too}

  frontend:
    build:
      context: ./frontend
    container_name: ai-farmer-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
